<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili 在线监控面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #000;
        color: #e5e7eb;
      }
      .glass-card {
        background: rgba(0, 0, 0, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(8px);
      }
      .video-card {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 9;
      }
      .video-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: saturate(0.8);
        transform: scale(1.02);
      }
      .video-mask {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to top,
            rgba(0, 0, 0, 0.93) 0%,
            rgba(0, 0, 0, 0.78) 45%,
            rgba(0, 0, 0, 0.5) 100%
          );
      }
      .video-content {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .count-number {
        display: inline-block;
        position: relative;
        z-index: 1;
        --glow-level: 0;
      }
      .count-number::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 0;
        z-index: -1;
        color: #34d399;
        filter: blur(calc(4px + (var(--glow-level) * 10px)));
        opacity: calc(0.12 + (var(--glow-level) * 0.5));
        animation: glowPulse calc(2.6s - (var(--glow-level) * 1.2s)) ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes glowPulse {
        0%,
        100% {
          opacity: calc(0.08 + (var(--glow-level) * 0.3));
        }
        50% {
          opacity: calc(0.22 + (var(--glow-level) * 0.7));
        }
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        display: inline-block;
      }
      .status-ok {
        background: #22c55e;
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
      }
      .status-bad {
        background: #ef4444;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.85);
      }
      .sparkline-layer {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        pointer-events: auto;
      }
      .sparkline-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .sparkline-tip {
        position: absolute;
        display: none;
        transform: translate(-50%, -115%);
        background: rgba(2, 6, 23, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 10px;
        color: #cbd5e1;
        white-space: nowrap;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body class="min-h-screen p-4 md:p-5">
    <main class="mx-auto max-w-[1800px]">
      <header class="mb-4 flex items-center justify-between gap-3 border-b border-slate-900 pb-3">
        <div class="flex items-center gap-2">
          <button
            id="open-settings-btn"
            class="rounded-md border border-slate-800 bg-black px-3 py-1.5 text-xs text-slate-200 transition hover:border-slate-700"
            type="button"
          >
            设置
          </button>
          <select
            id="sort-select"
            class="rounded-md border border-slate-800 bg-black px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-emerald-600"
          >
            <option value="default">默认排序</option>
            <option value="play_desc">播放高</option>
            <option value="play_asc">播放低</option>
            <option value="online_desc">在线人数高</option>
            <option value="online_asc">在线人数低</option>
          </select>
        </div>
        <div class="flex flex-col items-center leading-tight">
          <p class="text-[10px] text-slate-500">总在线人数</p>
          <p id="total-online-count" class="text-2xl font-semibold text-emerald-300">0</p>
        </div>
        <p id="last-update" class="text-[11px] text-slate-500">最后更新：--</p>
      </header>

      <section id="settings-panel" class="glass-card mb-4 hidden rounded-xl p-3">
        <div class="mb-2 flex items-center justify-between">
          <h2 class="text-xs font-semibold text-slate-100">监控设置</h2>
          <button
            id="close-settings-btn"
            class="rounded border border-slate-800 bg-black px-2 py-0.5 text-[11px] text-slate-300"
            type="button"
          >
            关闭
          </button>
        </div>
        <div class="grid grid-cols-1 gap-2 md:grid-cols-4">
          <label class="text-[11px] text-slate-300">
            UP 主 UID
            <input
              id="uid-input"
              type="text"
              class="mt-1 w-full rounded border border-slate-800 bg-black px-2 py-1.5 text-xs text-slate-100 outline-none focus:border-emerald-600"
              placeholder="例如 291386365"
            />
          </label>
          <label class="text-[11px] text-slate-300">
            最近视频条数
            <input
              id="limit-input"
              type="number"
              min="1"
              max="100"
              class="mt-1 w-full rounded border border-slate-800 bg-black px-2 py-1.5 text-xs text-slate-100 outline-none focus:border-emerald-600"
              placeholder="20"
            />
          </label>
          <label class="text-[11px] text-slate-300">
            数据缓存(ms)
            <input
              id="cache-ms-input"
              type="number"
              min="1000"
              max="120000"
              class="mt-1 w-full rounded border border-slate-800 bg-black px-2 py-1.5 text-xs text-slate-100 outline-none focus:border-emerald-600"
              placeholder="30000"
            />
          </label>
          <label class="text-[11px] text-slate-300">
            请求间隔(ms)
            <input
              id="throttle-ms-input"
              type="number"
              min="200"
              max="10000"
              class="mt-1 w-full rounded border border-slate-800 bg-black px-2 py-1.5 text-xs text-slate-100 outline-none focus:border-emerald-600"
              placeholder="3000"
            />
          </label>
          <label class="text-[11px] text-slate-300">
            轮询循环(ms)
            <input
              id="cycle-sleep-ms-input"
              type="number"
              min="1000"
              max="60000"
              class="mt-1 w-full rounded border border-slate-800 bg-black px-2 py-1.5 text-xs text-slate-100 outline-none focus:border-emerald-600"
              placeholder="15000"
            />
          </label>
          <label class="text-[11px] text-slate-300">
            视频列表刷新(ms)
            <input
              id="videos-refresh-ms-input"
              type="number"
              min="10000"
              max="86400000"
              class="mt-1 w-full rounded border border-slate-800 bg-black px-2 py-1.5 text-xs text-slate-100 outline-none focus:border-emerald-600"
              placeholder="600000"
            />
          </label>
          <label class="text-[11px] text-slate-300">
            播放量刷新(ms)
            <input
              id="play-refresh-ms-input"
              type="number"
              min="10000"
              max="3600000"
              class="mt-1 w-full rounded border border-slate-800 bg-black px-2 py-1.5 text-xs text-slate-100 outline-none focus:border-emerald-600"
              placeholder="180000"
            />
          </label>
          <div class="flex items-end">
            <button
              id="save-settings-btn"
              class="w-full rounded bg-emerald-700 px-2 py-1.5 text-xs font-semibold text-white transition hover:bg-emerald-600"
              type="button"
            >
              保存设置
            </button>
          </div>
        </div>
        <p id="settings-msg" class="mt-2 text-[11px] text-slate-400"></p>
      </section>

      <div
        id="video-grid"
        class="grid gap-2"
        style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));"
      ></div>
    </main>

    <script>
      const REFRESH_INTERVAL_MS = 5000;
      let videoList = [];
      let currentSort = "default";
      let sparklineScale = { min: 0, max: 1 };
      const fallbackCover = "https://via.placeholder.com/640x400/0f172a/e2e8f0?text=No+Cover";

      function toCoverProxy(coverUrl) {
        const src = (coverUrl || "").trim();
        if (!src) return fallbackCover;
        return `/api/cover?url=${encodeURIComponent(src)}`;
      }

      function createCard(video) {
        const bgUrl = toCoverProxy(video.cover);
        return `
          <article class="glass-card video-card rounded-lg p-2.5 cursor-pointer" id="card-${video.bvid}" data-bvid="${video.bvid}">
            <div class="video-bg" id="bg-${video.bvid}" style="background-image:url('${bgUrl}')"></div>
            <div class="video-mask"></div>
            <div class="video-content">
              <div>
                <a
                  href="https://www.bilibili.com/video/${video.bvid}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="line-clamp-2 text-xs font-semibold leading-4 text-slate-100 hover:text-emerald-300"
                  id="title-${video.bvid}"
                >${video.title || `视频 ${video.bvid}`}</a>
                <p class="mt-1 font-mono text-[10px] text-slate-300">${video.bvid}</p>
              </div>
              <div class="sparkline-layer" id="spark-wrap-${video.bvid}">
                <svg class="sparkline-svg" id="spark-${video.bvid}" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                <div class="sparkline-tip" id="spark-tip-${video.bvid}"></div>
              </div>
              <div>
                <div class="text-[10px] text-slate-300">正在看</div>
                <div class="mt-0.5 text-2xl font-bold text-emerald-300 count-number" id="count-${video.bvid}" data-text="--">--</div>
                <div class="mt-1 text-[10px] text-slate-400" id="play-${video.bvid}">播放：--</div>
                <div class="mt-1 flex items-center justify-end gap-1.5">
                  <span class="text-[10px] text-slate-400" id="meta-${video.bvid}">--:--:--</span>
                  <span class="status-dot status-ok" id="dot-${video.bvid}" title="刷新状态"></span>
                </div>
              </div>
            </div>
          </article>
        `;
      }

      function initGrid(list) {
        const grid = document.getElementById("video-grid");
        grid.innerHTML = list.map(createCard).join("");
        bindCardInteractions();
      }

      function bindCardInteractions() {
        document.querySelectorAll("[id^='card-']").forEach((cardEl) => {
          if (cardEl.dataset.bound === "1") return;
          const bvid = cardEl.dataset.bvid;
          cardEl.addEventListener("click", () => openDetail(bvid));
          const titleLink = cardEl.querySelector(`#title-${bvid}`);
          if (titleLink) {
            titleLink.addEventListener("click", (e) => e.stopPropagation());
          }
          cardEl.dataset.bound = "1";
        });
      }

      function openDetail(bvid) {
        window.location.href = `/detail.html?bvid=${encodeURIComponent(bvid)}`;
      }

      function setSettingsMessage(text, isError = false) {
        const msg = document.getElementById("settings-msg");
        msg.textContent = text;
        msg.className = `mt-3 text-xs ${isError ? "text-rose-400" : "text-slate-400"}`;
      }

      async function loadSettings() {
        try {
          const res = await fetch("/api/settings");
          const payload = await res.json();
          if (!payload.success) {
            throw new Error(payload.message || "读取设置失败");
          }

          document.getElementById("uid-input").value = payload.settings.upMid || "";
          document.getElementById("limit-input").value = String(payload.settings.maxVideos || 20);
          document.getElementById("cache-ms-input").value = String(payload.settings.cacheMs || 15000);
          document.getElementById("throttle-ms-input").value = String(payload.settings.throttleMs || 1200);
          document.getElementById("cycle-sleep-ms-input").value = String(payload.settings.cycleSleepMs || 5000);
          document.getElementById("videos-refresh-ms-input").value = String(payload.settings.videosRefreshMs || 600000);
          document.getElementById("play-refresh-ms-input").value = String(payload.settings.playRefreshMs || 180000);
          setSettingsMessage("已加载当前设置");
        } catch (error) {
          setSettingsMessage(`读取设置失败：${error.message}`, true);
        }
      }

      async function saveSettings() {
        const button = document.getElementById("save-settings-btn");
        const upMid = document.getElementById("uid-input").value.trim();
        const maxVideos = Number(document.getElementById("limit-input").value);
        const cacheMs = Number(document.getElementById("cache-ms-input").value);
        const throttleMs = Number(document.getElementById("throttle-ms-input").value);
        const cycleSleepMs = Number(document.getElementById("cycle-sleep-ms-input").value);
        const videosRefreshMs = Number(document.getElementById("videos-refresh-ms-input").value);
        const playRefreshMs = Number(document.getElementById("play-refresh-ms-input").value);

        button.disabled = true;
        button.textContent = "保存中...";
        setSettingsMessage("正在保存设置...");

        try {
          const res = await fetch("/api/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              upMid,
              maxVideos,
              cacheMs,
              throttleMs,
              cycleSleepMs,
              videosRefreshMs,
              playRefreshMs,
            }),
          });
          const payload = await res.json();
          if (!payload.success) {
            throw new Error(payload.message || "保存失败");
          }

          setSettingsMessage("设置已保存，正在刷新数据...");
          videoList = [];
          await refreshAll();
        } catch (error) {
          setSettingsMessage(`保存失败：${error.message}`, true);
        } finally {
          button.disabled = false;
          button.textContent = "保存设置";
        }
      }

      function setCardData(video) {
        const { bvid, count, source, updatedAt, error, cover, play, title } = video;
        const countEl = document.getElementById(`count-${bvid}`);
        const metaEl = document.getElementById(`meta-${bvid}`);
        const bgEl = document.getElementById(`bg-${bvid}`);
        const playEl = document.getElementById(`play-${bvid}`);
        const dotEl = document.getElementById(`dot-${bvid}`);
        const titleEl = document.getElementById(`title-${bvid}`);
        if (!countEl || !metaEl || !dotEl) return;

        const normalizedOnline = normalizeOnlineCount(count);
        const countText = normalizedOnline === null ? "--" : String(normalizedOnline);
        countEl.textContent = countText;
        countEl.setAttribute("data-text", countText);
        const onlineNum = normalizedOnline === null ? 0 : normalizedOnline;
        const glowLevel = Math.max(0, Math.min(1, Math.log10(onlineNum + 1) / 4));
        countEl.style.setProperty("--glow-level", glowLevel.toFixed(3));
        if (bgEl) {
          bgEl.style.backgroundImage = `url('${toCoverProxy(cover)}')`;
        }
        if (titleEl && title) titleEl.textContent = title;
        if (playEl) playEl.textContent = `播放：${play ?? "--"}`;
        const timeText = updatedAt ? new Date(updatedAt).toLocaleTimeString() : "--";
        const isBad = Boolean(error) || source === "stale" || source === "error" || source === "empty";
        dotEl.classList.remove("status-ok", "status-bad");
        dotEl.classList.add(isBad ? "status-bad" : "status-ok");
        dotEl.title = isBad ? "刷新异常" : "刷新正常";
        metaEl.textContent = `刷新 ${timeText}`;
        renderSparkline(video);
      }

      function toNumber(val) {
        if (typeof val === "number") return val;
        const str = String(val ?? "").trim();
        if (!str || str === "--") return 0;
        if (str.endsWith("万")) return Math.round(Number(str.slice(0, -1)) * 10000) || 0;
        if (str.endsWith("亿")) return Math.round(Number(str.slice(0, -1)) * 100000000) || 0;
        return Number(str.replaceAll(",", "")) || 0;
      }

      function normalizeOnlineCount(val) {
        const raw = String(val ?? "").trim();
        if (!raw || raw === "--") return null;
        const n = toNumber(raw);
        if (!Number.isFinite(n) || n < 0) return null;
        return n;
      }

      function updateTotalOnline(videos) {
        const totalEl = document.getElementById("total-online-count");
        if (!totalEl) return;
        let total = 0;
        videos.forEach((video) => {
          const n = normalizeOnlineCount(video.count);
          if (n !== null) total += n;
        });
        totalEl.textContent = String(total);
      }

      function buildSmoothPath(coords) {
        if (!coords.length) return "";
        if (coords.length === 1) return `M ${coords[0].x} ${coords[0].y}`;
        let d = `M ${coords[0].x} ${coords[0].y}`;
        for (let i = 0; i < coords.length - 1; i += 1) {
          const p0 = coords[i === 0 ? i : i - 1];
          const p1 = coords[i];
          const p2 = coords[i + 1];
          const p3 = coords[i + 2] || p2;
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
        }
        return d;
      }

      function renderSparkline(video) {
        const bvid = video.bvid;
        const svg = document.getElementById(`spark-${bvid}`);
        const wrap = document.getElementById(`spark-wrap-${bvid}`);
        const tip = document.getElementById(`spark-tip-${bvid}`);
        if (!svg || !wrap || !tip) return;
        const points = (video.history1h || []).filter((p) => Number.isFinite(p.online));
        if (points.length < 2) {
          svg.innerHTML = "";
          tip.style.display = "none";
          return;
        }
        const values = points.map((p) => Number(p.online) || 0);
        const min = sparklineScale.min;
        const max = sparklineScale.max;
        const range = Math.max(1, max - min);
        const coords = values.map((v, i) => {
          const x = (i / (values.length - 1)) * 100;
          // Keep the sparkline in lower part, and let area touch card bottom.
          const y = 98 - ((v - min) / range) * 28;
          return { x, y };
        });
        const pathD = buildSmoothPath(coords);
        const areaD = `${pathD} L 100 100 L 0 100 Z`;
        svg.innerHTML = `
          <defs>
            <filter id="spark-glow-${bvid}" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="0.8" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path d="${areaD}" fill="rgba(187, 247, 208, 0.045)" stroke="none"></path>
          <path
            d="${pathD}"
            fill="none"
            stroke="#dcfce7"
            stroke-opacity="0.48"
            stroke-width="0.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#spark-glow-${bvid})"
          ></path>
        `;

        if (!wrap.dataset.bound) {
          wrap.addEventListener("mousemove", (e) => {
            const rect = wrap.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / Math.max(1, rect.width);
            const idx = Math.max(0, Math.min(points.length - 1, Math.round(ratio * (points.length - 1))));
            const p = points[idx];
            const online = Number(p.online) || 0;
            const d = new Date(p.timestamp);
            tip.textContent = `${d.toLocaleString()} | 在线 ${online} | 播放 ${p.play}`;
            tip.style.left = `${(coords[idx].x / 100) * rect.width}px`;
            tip.style.top = `${(coords[idx].y / 100) * rect.height}px`;
            tip.style.display = "block";
          });
          wrap.addEventListener("mouseleave", () => {
            tip.style.display = "none";
          });
          wrap.dataset.bound = "1";
        }
      }

      function computeGlobalSparklineScale(videos) {
        const all = [];
        videos.forEach((video) => {
          (video.history1h || []).forEach((p) => {
            const n = Number(p.online) || 0;
            all.push(n);
          });
          const current = normalizeOnlineCount(video.count);
          if (current !== null) all.push(current);
        });
        const max = Math.max(1, ...all);
        // Force shared baseline for better cross-card comparability.
        sparklineScale = { min: 0, max };
      }

      function sortVideos(list, mode) {
        const cloned = [...list];
        if (mode === "play_desc") {
          return cloned.sort((a, b) => (b.playNumber || toNumber(b.play)) - (a.playNumber || toNumber(a.play)));
        }
        if (mode === "play_asc") {
          return cloned.sort((a, b) => (a.playNumber || toNumber(a.play)) - (b.playNumber || toNumber(b.play)));
        }
        if (mode === "online_desc") {
          return cloned.sort(
            (a, b) => (normalizeOnlineCount(b.count) ?? -1) - (normalizeOnlineCount(a.count) ?? -1)
          );
        }
        if (mode === "online_asc") {
          return cloned.sort(
            (a, b) => (normalizeOnlineCount(a.count) ?? 1e12) - (normalizeOnlineCount(b.count) ?? 1e12)
          );
        }
        return cloned;
      }

      async function refreshAll() {
        try {
          const response = await fetch("/api/online-data", { cache: "no-store" });
          const payload = await response.json();

          if (!payload.success) {
            throw new Error(payload.message || "接口返回失败");
          }

          const incoming = payload.videos || [];
          // 调试：检查 BV1H3Aez9ESM 的 count
          const debugV = incoming.find((v) => v.bvid === "BV1H3Aez9ESM");
          if (debugV) console.log("[DEBUG] BV1H3Aez9ESM from API:", debugV.count, "full:", debugV);
          const sorted = sortVideos(incoming, currentSort);
          computeGlobalSparklineScale(sorted);
          const byBvid = new Map(sorted.map((v) => [v.bvid, v]));
          const incomingBvidOrder = sorted.map((v) => v.bvid).join(",");
          const currentBvidOrder = videoList.map((v) => v.bvid).join(",");
          if (!videoList.length || incomingBvidOrder !== currentBvidOrder) {
            videoList = sorted;
            initGrid(videoList);
          }

          sorted.forEach((video) => {
            if (byBvid.has(video.bvid)) {
              setCardData(video);
            }
          });
          updateTotalOnline(sorted);

          document.getElementById("last-update").textContent =
            `最后更新：${new Date().toLocaleTimeString()}`;
        } catch (error) {
          videoList.forEach((video) => {
            setCardData({
              ...video,
              count: "--",
              source: "error",
              updatedAt: null,
              error: error.message,
            });
          });
          document.getElementById("last-update").textContent =
            `最后更新失败：${new Date().toLocaleTimeString()}`;
          updateTotalOnline([]);
          console.error("refreshAll error:", error);
        }
      }

      function toggleSettings(show) {
        const panel = document.getElementById("settings-panel");
        panel.classList.toggle("hidden", !show);
      }

      document.getElementById("save-settings-btn").addEventListener("click", saveSettings);
      document.getElementById("open-settings-btn").addEventListener("click", () => {
        const panel = document.getElementById("settings-panel");
        toggleSettings(panel.classList.contains("hidden"));
      });
      document.getElementById("close-settings-btn").addEventListener("click", () => toggleSettings(false));
      document.getElementById("sort-select").addEventListener("change", (e) => {
        currentSort = e.target.value;
        videoList = [];
        refreshAll();
      });
      loadSettings();
      refreshAll();
      setInterval(refreshAll, REFRESH_INTERVAL_MS);
    </script>
  </body>
</html>
