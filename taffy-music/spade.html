<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spade - 黑桃影2020生日纪念</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* 核心：1920x1080 绝对画布 */
        #player-wrapper {
            width: 1920px;
            height: 1080px;
            position: relative;
            transform-origin: center center;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        
        .heavy-shadow { filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.9)) drop-shadow(0px 0px 20px rgba(0, 0, 0, 0.7)); }
        .text-glow { text-shadow: 0 0 25px rgba(255,255,255,0.4), 0 4px 15px rgba(0,0,0,0.9); }
        .cover-shadow { box-shadow: 0 30px 60px -15px rgba(0,0,0,0.9), 0 0 40px rgba(255,255,255,0.15); }

        video::-webkit-media-controls { display: none !important; }

        /* 两行溢出省略号 */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 波形边缘羽化透明效果 (左右对称 120px) */
        .waveform-mask {
            -webkit-mask-image: linear-gradient(90deg, transparent 0px, black 120px, black 1800px, transparent 1920px);
            mask-image: linear-gradient(90deg, transparent 0px, black 120px, black 1800px, transparent 1920px);
        }

        /* 歌词动效 */
        .lyric-container-box { position: relative; width: 100%; height: 200px; }
        .lyric-item {
            position: absolute; left: 0; bottom: 0; width: 100%; opacity: 0;
            transform: translateY(60px) scale(0.95); filter: blur(12px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: left bottom;
        }
        .lyric-item.lyric-active { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        .lyric-item.lyric-exit { opacity: 0; transform: translateY(-40px) scale(1.02); filter: blur(10px); }

        /* 动态模糊与遮罩过渡 */
        #mediaPlayer, #maskGradient1, #maskGradient2 { transition: all 1.5s ease-in-out; }

        /* 5秒顺时针无限旋转 */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 5s linear infinite;
        }
    </style>
</head>
<body>

    <div id="player-wrapper">
        
        <!-- 1. 视频与动态蒙版层 -->
        <div class="absolute inset-0 z-0">
            <video id="mediaPlayer" class="w-full h-full object-cover opacity-80 blur-md scale-105 transition-all duration-1000" crossorigin="anonymous"></video>
            
            <div id="maskGradient1" class="absolute inset-0 bg-gradient-to-r from-black/95 via-black/50 to-transparent transition-all duration-1000"></div>
            <div id="maskGradient2" class="absolute inset-x-0 bottom-0 h-[400px] bg-gradient-to-t from-black/90 to-transparent transition-all duration-1000"></div>
        </div>

        <!-- 全局切歌黑场遮罩与缓冲层 -->
        <div id="transitionOverlay" class="absolute inset-0 bg-black z-[100] opacity-0 pointer-events-none transition-opacity duration-1000 flex flex-col items-center justify-center">
        </div>

        <!-- 2. UI 交互层 -->
        <div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-between px-[120px] pt-[80px] pb-[160px]">
            
            <div class="flex flex-col justify-between h-full w-[950px]">
                <!-- 智能排版区域 -->
                <div class="mt-8 w-full flex flex-col space-y-4">
                    <!-- 标题：最大两行，纯白色 -->
                    <div id="titleContainer" class="w-full text-[80px] font-black tracking-widest text-white text-glow leading-tight line-clamp-2 break-words min-h-[120px]">
                        <!-- JS Inject Title Here -->
                    </div>

                    <!-- 详情：两行截断 -->
                    <div class="flex flex-col space-y-2 heavy-shadow pt-4 max-w-[900px]">
                        <span id="singerName" class="text-[36px] font-bold text-white tracking-wider mb-2"></span>
                        <div id="descContainer" class="w-full text-[20px] font-sans tracking-wide text-white/70 line-clamp-2 leading-relaxed break-words opacity-90">
                             <!-- JS Inject Desc Here -->
                        </div>
                    </div>
                </div>

                <!-- 歌词与标签 -->
                <div class="w-full pb-[40px]">
                    <div class="lyric-container-box mb-[50px] heavy-shadow" id="lyricContainer"></div>
                    <div class="flex items-center space-x-6 heavy-shadow opacity-90">
                        <div class="flex items-center space-x-3 border-2 border-white/50 px-5 py-2 rounded-lg bg-black/30 backdrop-blur-md">
                            <span class="text-[22px] tracking-widest font-bold text-white font-sans">「 Spade · 黑桃影2020生日纪念 」</span>
                        </div>
                        <span id="bvidText" class="text-white/60 font-sans text-[24px] tracking-widest"></span>
                    </div>
                </div>
            </div>

            <!-- 封面装饰层（无黑胶） -->
            <div class="flex justify-end items-center h-full w-[700px]">
                <div class="relative w-[576px] h-[576px] z-10">
                    <div class="w-full h-full aspect-square rounded-[2.5rem] overflow-hidden cover-shadow border-[3px] border-white/10 relative bg-neutral-900 flex items-center justify-center transition-all duration-700 z-10">
                        <img id="coverImage" src="" alt="Cover" class="w-full h-full object-cover transition-opacity duration-1000 opacity-0">
                        <div class="absolute inset-0 bg-gradient-to-tr from-black/30 to-transparent"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 波形图 -->
        <div class="absolute bottom-0 left-0 w-full h-[220px] z-20 pointer-events-none opacity-90 transition-opacity duration-1000 waveform-mask" id="waveformContainer">
            <canvas id="waveform" class="w-full h-full"></canvas>
        </div>

        <!-- 4. 控制面板 -->
        <div id="controlPanel" class="absolute z-50 inset-0 bg-black/80 backdrop-blur-xl flex flex-col items-center justify-center transition-opacity duration-700 pointer-events-auto">
            <div class="bg-white/10 p-[60px] rounded-3xl border border-white/20 text-center max-w-2xl w-full cover-shadow">
                <h2 class="text-[36px] font-bold mb-6 font-sans text-white tracking-widest">Spade 播控</h2>
                <p class="text-[20px] text-white/70 mb-10 font-sans">请选择 <span class="text-white font-bold">spade</span> 文件夹</p>
                
                <label class="cursor-pointer bg-white text-black px-16 py-5 rounded-full font-bold text-[24px] hover:bg-neutral-200 transition-all transform hover:scale-105 font-sans shadow-2xl inline-block mb-4">
                    选择文件夹并播放
                    <input type="file" id="folderUpload" webkitdirectory directory class="hidden">
                </label>
                <div id="loadingStatus" class="text-white/50 text-sm mt-4 font-sans">每次修改本地歌词后，请重新选择文件夹加载。</div>
            </div>
        </div>

    </div>

    <script>
        // --- 0. 视口自适应 ---
        function resizePlayer() {
            const wrapper = document.getElementById('player-wrapper');
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizePlayer);
        resizePlayer();

        // --- 1. 全局状态与播控数据 ---
        let playlist = [];
        let currentIndex = 0;
        let lyricsList = [];
        let currentLyricIndex = -1;
        let currentLyricEl = null;
        let isTransitioning = false;

        const mediaPlayer = document.getElementById('mediaPlayer');
        const transitionOverlay = document.getElementById('transitionOverlay');
        const coverImage = document.getElementById('coverImage');

        // --- 2. 文件夹解析：选取 spade 文件夹后直接播放 ---
        document.getElementById('folderUpload').addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            document.getElementById('loadingStatus').textContent = "正在扫描文件...";

            const groups = {};
            for (let f of files) {
                const name = f.name.toLowerCase();
                const parts = f.webkitRelativePath.split('/');
                const folder = parts.length >= 2 ? parts[parts.length - 2] : '.';
                if (!groups[folder]) groups[folder] = {};
                if (name.endsWith('.mp4')) groups[folder].video = f;
                else if (name.endsWith('.jpg') || name.endsWith('.png')) groups[folder].cover = f;
                else if (name.endsWith('.json')) groups[folder].meta = f;
                else if (name.endsWith('.lrc')) groups[folder].lrc = f;
            }

            const folderKeys = Object.keys(groups).filter(k => groups[k].video);
            playlist = folderKeys.map(k => groups[k]);

            if (playlist.length > 0) {
                document.getElementById('controlPanel').classList.add('opacity-0', 'pointer-events-none');
                playTrack(0);
            } else {
                alert("未在文件夹中找到有效的 MP4 视频文件！");
                document.getElementById('loadingStatus').textContent = "";
            }
        });

        // --- 3. 视觉动态调整 ---
        function updateVisualMode(hasLrc) {
            const videoEl = document.getElementById('mediaPlayer');
            const mask1 = document.getElementById('maskGradient1');
            const mask2 = document.getElementById('maskGradient2');
            if (hasLrc) {
                videoEl.classList.remove('blur-none', 'blur-sm');
                videoEl.classList.add('blur-md');
                mask1.className = "absolute inset-0 bg-gradient-to-r from-black/95 via-black/50 to-transparent transition-all duration-1500";
                mask2.className = "absolute inset-x-0 bottom-0 h-[400px] bg-gradient-to-t from-black/90 to-transparent transition-all duration-1500";
            } else {
                videoEl.classList.remove('blur-md', 'blur-sm');
                videoEl.classList.add('blur-none');
                mask1.className = "absolute inset-0 bg-gradient-to-r from-black/60 via-black/20 to-transparent transition-all duration-1500";
                mask2.className = "absolute inset-x-0 bottom-0 h-[200px] bg-gradient-to-t from-black/60 to-transparent transition-all duration-1500";
            }
        }

        // --- 4. 切歌与淡入淡出引擎 ---
        async function playTrack(index) {
            if (playlist.length === 0 || isTransitioning) return;
            isTransitioning = true;
            if (index >= playlist.length) index = 0;
            if (index < 0) index = playlist.length - 1;
            currentIndex = index;
            const track = playlist[index];

            if (!mediaPlayer.paused) {
                transitionOverlay.style.opacity = '1';
                let vol = mediaPlayer.volume;
                while (vol > 0.05) {
                    vol -= 0.05;
                    mediaPlayer.volume = vol;
                    await new Promise(r => setTimeout(r, 20));
                }
                mediaPlayer.pause();
                mediaPlayer.volume = 0;
            } else {
                mediaPlayer.volume = 0;
                transitionOverlay.style.opacity = '1';
                await new Promise(r => setTimeout(r, 200));
            }

            document.getElementById('titleContainer').textContent = "加载中...";
            document.getElementById('descContainer').innerHTML = "";
            document.getElementById('singerName').textContent = "";
            document.getElementById('bvidText').textContent = "";
            coverImage.classList.add('opacity-0');

            mediaPlayer.src = URL.createObjectURL(track.video);
            if (track.cover) {
                coverImage.src = URL.createObjectURL(track.cover);
                coverImage.classList.remove('opacity-0');
            }

            if (track.meta) {
                try {
                    let metaText = await track.meta.text();
                    metaText = metaText.replace(/^\uFEFF/, '');
                    const metaData = JSON.parse(metaText);
                    document.getElementById('titleContainer').textContent = metaData._source?.title || metaData["歌曲名"] || "Spade";
                    const descText = metaData._source?.desc || "";
                    document.getElementById('descContainer').innerHTML = descText.split('\n').filter(Boolean).join(' &nbsp;·&nbsp; ');
                    document.getElementById('singerName').textContent = metaData["演唱者"] || "黑桃影";
                    document.getElementById('bvidText').textContent = metaData._source?.bvid || "BV1ea4y1W7x1";
                } catch (e) {
                    document.getElementById('titleContainer').textContent = "Metadata 解析失败";
                }
            } else {
                document.getElementById('titleContainer').textContent = "Spade";
            }

            lyricsList = [];
            currentLyricIndex = -1;
            document.getElementById('lyricContainer').innerHTML = '';
            if (track.lrc) {
                try {
                    let text = await track.lrc.text();
                    text = text.replace(/^\uFEFF/, '');
                    const lines = text.split('\n');
                    const timeReg = /\[(\d{1,3}):(\d{1,2}(?:\.\d{1,3})?)\](.*)/;
                    lines.forEach(line => {
                        const match = line.match(timeReg);
                        if (match && match[3].trim()) {
                            const minutes = parseInt(match[1], 10);
                            const seconds = parseFloat(match[2]);
                            lyricsList.push({ time: minutes * 60 + seconds, text: match[3].trim() });
                        }
                    });
                    updateVisualMode(true);
                } catch (e) { updateVisualMode(false); }
            } else {
                updateVisualMode(false);
            }

            initAudioVisualizer();
            if (audioContext && audioContext.state === 'suspended') await audioContext.resume();

            try {
                await mediaPlayer.play();
                transitionOverlay.style.opacity = '0';
                let vol = 0;
                while (vol < 0.95) {
                    vol += 0.05;
                    mediaPlayer.volume = vol;
                    await new Promise(r => setTimeout(r, 20));
                }
                mediaPlayer.volume = 1;
            } catch (e) { console.error("Play Failed", e); }
            finally { isTransitioning = false; }
        }

        mediaPlayer.addEventListener('ended', () => {
            playTrack(currentIndex + 1);
        });

        // --- 4. 歌词轮播 ---
        mediaPlayer.addEventListener('timeupdate', () => {
            if (lyricsList.length === 0) return;
            const ct = mediaPlayer.currentTime;
            const duration = mediaPlayer.duration;

            if (duration && (ct >= duration - 0.5 || mediaPlayer.ended)) {
                if (currentLyricEl) {
                    currentLyricEl.classList.remove('lyric-active');
                    currentLyricEl.classList.add('lyric-exit');
                    currentLyricEl = null;
                    currentLyricIndex = -1;
                }
                return;
            }

            let newIndex = -1;
            for (let i = 0; i < lyricsList.length; i++) {
                if (ct >= lyricsList[i].time) newIndex = i;
                else break;
            }
            if (newIndex !== currentLyricIndex) {
                currentLyricIndex = newIndex;
                renderLyrics();
            }
        });

        function renderLyrics() {
            let targetText = "♪";
            let prevText = "";
            if (currentLyricIndex >= 0 && currentLyricIndex < lyricsList.length) {
                targetText = lyricsList[currentLyricIndex].text;
                prevText = currentLyricIndex > 0 ? lyricsList[currentLyricIndex - 1].text : "";
            }

            if (currentLyricEl && currentLyricEl.dataset.text === targetText) return;
            const container = document.getElementById('lyricContainer');

            if (currentLyricEl) {
                const oldEl = currentLyricEl;
                oldEl.classList.remove('lyric-active');
                oldEl.classList.add('lyric-exit');
                setTimeout(() => { if (oldEl.parentNode) oldEl.parentNode.removeChild(oldEl); }, 1200);
            }

            const newEl = document.createElement('div');
            newEl.className = 'lyric-item text-white';
            newEl.dataset.text = targetText;
            newEl.innerHTML = `
                ${prevText ? `<p class="text-[32px] text-white/50 mb-3 font-normal tracking-wide">${prevText}</p>` : ''}
                <p class="text-[60px] font-bold text-glow tracking-widest leading-tight">${targetText}</p>
            `;
            container.appendChild(newEl);
            void newEl.offsetWidth;
            newEl.classList.add('lyric-active');
            currentLyricEl = newEl;
        }

        // --- 5. 波形图 ---
        let audioContext, analyser, dataArray;
        let isSourceConnected = false;

        function initAudioVisualizer() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                const canvas = document.getElementById('waveform');
                canvas.width = 1920;
                canvas.height = 220;
                drawWaveform();
            }

            if (!isSourceConnected) {
                const sourceNode = audioContext.createMediaElementSource(mediaPlayer);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
                isSourceConnected = true;
            }
        }

        function drawWaveform() {
            requestAnimationFrame(drawWaveform);
            const canvas = document.getElementById('waveform');
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const renderCount = Math.floor(dataArray.length * 0.45);
            const slotWidth = canvas.width / renderCount;
            const barWidth = slotWidth * 0.65;

            ctx.lineCap = 'round';
            ctx.lineWidth = barWidth;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();

            let x = slotWidth / 2;
            for (let i = 0; i < renderCount; i++) {
                let barHeight = (dataArray[i] / 255) * (canvas.height * 0.95);
                if (barHeight < 3) barHeight = 3;
                ctx.moveTo(x, canvas.height);
                ctx.lineTo(x, canvas.height - barHeight);
                x += slotWidth;
            }
            ctx.stroke();
        }

        // --- 7. 键盘控制 ---
        window.addEventListener('keydown', (e) => {
            if (playlist.length === 0) return;
            if (e.key === 'ArrowRight') playTrack(currentIndex + 1);
            else if (e.key === 'ArrowLeft') playTrack(currentIndex - 1);
        });
    </script>
</body>
</html>
